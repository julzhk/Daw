<div id="lanes">
  {% for track, regions in tracks %}
    <div class="relative h-20 border-t border-base-300"
         data-on:dragover="evt.preventDefault()"
         data-on:drop="evt.preventDefault(); $drag = evt.dataTransfer.getData('text/plain'); $dropTrack = {{ track }}; $dropAt = (evt.clientX - el.getBoundingClientRect().left - $_grab) / {{ pps }}; @post('{% url 'drop' %}')">
      <span class="absolute left-1 top-1 text-xs opacity-40 pointer-events-none">Track {{ track|add:1 }}</span>
      {% for r in regions %}
        <div id="region-{{ r.id }}" draggable="true"
             class="absolute top-1 bottom-1 rounded bg-primary/20 border border-primary overflow-hidden cursor-grab"
             style="left: calc({{ r.start|stringformat:'f' }} * var(--pps)); width: calc({{ r.span|stringformat:'f' }} * var(--pps))"
             data-class="{'ring-2 ring-warning': $selected == {{ r.id }}}"
             data-on:click="@get('{% url 'region' r.id %}')"
             data-on:dragstart="evt.dataTransfer.setData('text/plain', 'region:{{ r.id }}'); $_grab = evt.clientX - el.getBoundingClientRect().left">
          <daw-wave class="text-primary" src="{{ r.clip.file.url }}"
                    offset="{{ r.offset|stringformat:'f' }}" length="{{ r.length|stringformat:'f' }}"></daw-wave>
          <span class="relative text-xs px-1 pointer-events-none">{{ r.clip.name }}</span>
        </div>
      {% endfor %}
    </div>
  {% endfor %}
  {{ arrangement|json_script:"arrangement" }}
</div>
